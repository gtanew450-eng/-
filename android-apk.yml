name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK (supports root folder or AdvancedTreasuryBills subfolder)
        shell: bash
        run: |
          if [ -f settings.gradle.kts ]; then
            PROJECT_DIR="."
          elif [ -f AdvancedTreasuryBills/settings.gradle.kts ]; then
            PROJECT_DIR="AdvancedTreasuryBills"
          else
            echo "Could not find settings.gradle.kts" >&2
            exit 1
          fi
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: TreasuryBills-Android-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            AdvancedTreasuryBills/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
